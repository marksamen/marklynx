<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/copyright/favicon.ico" type="image/x-icon">
<title>Mark Lynx Admin — Work in Progress</title>
<style>
html,body{height:100%;margin:0;font-family:Arial,sans-serif;background:#111;color:#fff}
body{display:grid;place-items:center;text-align:center}
h1{margin:0 0 .35rem}p{margin:0;opacity:.7}
#login,#admin{width:min(92vw,420px)}
#admin{display:none}
form{display:grid;gap:.8rem;margin-top:1.5rem}
input,button{box-sizing:border-box;width:100%;padding:.85rem 1rem;border-radius:8px;font:inherit}
input{border:1px solid #555;background:#1c1c1c;color:#fff}
button{border:0;cursor:pointer;font-weight:700}
#error{min-height:1.2em;margin-top:.8rem;color:#ff8d8d;opacity:1}
.admin-link{box-sizing:border-box;display:block;width:100%;margin-top:.8rem;padding:.85rem 1rem;border-radius:8px;text-decoration:none;font-weight:700}
#claims{margin-top:1.5rem;background:#fff;color:#111}
#youtubeClaims{background:#c62828;color:#fff}
#testPanel{box-sizing:border-box;width:100%;margin-top:.8rem;padding:1rem;border:1px solid #444;border-radius:8px;background:#1c1c1c}
#siteLinks{display:grid;gap:.55rem;margin-top:.8rem}
#siteLinks .admin-link{margin-top:0;background:#2b2b2b;color:#fff;border:1px solid #555}
#siteLinks .primary{background:#1565c0;border-color:#1565c0}
#testStatus{margin:0 0 .8rem;font-weight:700;opacity:1}
#testStatus.on{color:#6dff8b}
#testStatus.off{color:#ff6d6d}
#testToggle.enable{background:#1f9d49;color:#fff}
#testToggle.disable{background:#a82d2d;color:#fff}
#logout{margin-top:.8rem}
</style>
</head>
<body>
<main id="login">
<h1>Mark Lynx Admin</h1><p>AUTHORIZED ACCESS ONLY</p>
<form id="loginForm">
<input id="email" type="email" autocomplete="username" placeholder="Email" required>
<input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
<button type="submit">Sign In</button>
</form>
<div id="error" role="alert" aria-live="polite"></div>
</main>
<main id="admin">
<h1>Mark Lynx Admin</h1><p>WORK IN PROGRESS — REV03</p>
<a id="claims" class="admin-link" href="claims/">Copyright Claims</a>
<a id="youtubeClaims" class="admin-link" href="https://studio.youtube.com/channel/UCGY3Rz3lQ_r9gnWvP-NIDHQ/videos/upload?filter=%5B%7B%22name%22%3A%22HAS_COPYRIGHT_CLAIM%22%2C%22value%22%3A%22VIDEO_HAS_COPYRIGHT_CLAIM%22%7D%5D&amp;sort=%7B%22columnType%22%3A%22date%22%2C%22sortOrder%22%3A%22DESCENDING%22%7D" target="_blank" rel="noopener noreferrer">Check YouTube Copyright Claims</a>
<section id="testPanel" aria-label="Test content control">
<p id="testStatus"></p>
<button id="testToggle" type="button"></button>
<div id="siteLinks" aria-label="YouTube site launch and redirect checks">
<a class="admin-link primary" href="https://youtube.marklynx.com" target="_blank" rel="noopener noreferrer">Open HTTPS Site</a>
<a class="admin-link" href="http://youtube.marklynx.com" target="_blank" rel="noopener noreferrer">Test HTTP Redirect</a>
<a class="admin-link" href="http://copyright.marklynx.com" target="_blank" rel="noopener noreferrer">Test Copyright Redirect</a>
</div>
</section>
<button id="logout" type="button">Sign Out</button>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { getAuth, setPersistence, browserLocalPersistence, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAyaoxwg1-Ru821Y6ohRxwT_DL3bsO8zfQ",
  authDomain: "mark-lynx-admin.firebaseapp.com",
  projectId: "mark-lynx-admin",
  storageBucket: "mark-lynx-admin.firebasestorage.app",
  messagingSenderId: "749999035332",
  appId: "1:749999035332:web:52c78e6e358c1fef794a91"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const login = document.getElementById("login");
const admin = document.getElementById("admin");
const form = document.getElementById("loginForm");
const error = document.getElementById("error");

function loggedOut(){admin.style.display="none";login.style.display="block";}
function loggedIn(){login.style.display="none";admin.style.display="block";form.reset();error.textContent="";}

await setPersistence(auth,browserLocalPersistence);
onAuthStateChanged(auth,user=>user?loggedIn():loggedOut());

form.addEventListener("submit",async e=>{
  e.preventDefault(); error.textContent="";
  try{
    await signInWithEmailAndPassword(auth,
      document.getElementById("email").value.trim(),
      document.getElementById("password").value);
  }catch(e){error.textContent="Invalid email or password.";}
});

document.getElementById("logout").addEventListener("click",()=>signOut(auth));

const TEST_KEY="marklynxTestContent";
const testStatus=document.getElementById("testStatus");
const testToggle=document.getElementById("testToggle");
function testHidden(){return (localStorage.getItem(TEST_KEY)||"Y").toUpperCase()==="Y";}
function drawTestControl(){
  const hidden=testHidden();
  testStatus.textContent="TEST CONTENT: "+(hidden?"OFF":"ON");
  testStatus.className=hidden?"off":"on";
  testToggle.textContent=hidden?"TURN TEST CONTENT ON":"TURN TEST CONTENT OFF";
  testToggle.className=hidden?"enable":"disable";
}
testToggle.addEventListener("click",()=>{
  localStorage.setItem(TEST_KEY,testHidden()?"N":"Y");
  drawTestControl();
});
drawTestControl();
</script>
</body>
</html>

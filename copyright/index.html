<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mark Lynx Admin — Work in Progress</title>
<style>
html,body{height:100%;margin:0;font-family:Arial,sans-serif;background:#111;color:#fff}
body{display:grid;place-items:center;text-align:center}
h1{margin:0 0 .35rem}p{margin:0;opacity:.7}
#login,#admin{width:min(92vw,420px)}
#admin{display:none}
form{display:grid;gap:.8rem;margin-top:1.5rem}
input,button{box-sizing:border-box;width:100%;padding:.85rem 1rem;border-radius:8px;font:inherit}
input{border:1px solid #555;background:#1c1c1c;color:#fff}
button{border:0;cursor:pointer;font-weight:700}
#error{min-height:1.2em;margin-top:.8rem;color:#ff8d8d;opacity:1}
#claims{box-sizing:border-box;display:block;width:100%;margin-top:1.5rem;padding:.85rem 1rem;border-radius:8px;background:#fff;color:#111;text-decoration:none;font-weight:700}
#logout{margin-top:.8rem}
</style>
</head>
<body>
<main id="login">
<h1>Mark Lynx Admin</h1><p>AUTHORIZED ACCESS ONLY</p>
<form id="loginForm">
<input id="email" type="email" autocomplete="username" placeholder="Email" required>
<input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
<button type="submit">Sign In</button>
</form>
<div id="error" role="alert" aria-live="polite"></div>
</main>
<main id="admin">
<h1>Mark Lynx Admin</h1><p>WORK IN PROGRESS — REV01</p>
<a id="claims" href="claims/">Copyright Claims</a>
<button id="logout" type="button">Sign Out</button>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { getAuth, setPersistence, browserLocalPersistence, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAyaoxwg1-Ru821Y6ohRxwT_DL3bsO8zfQ",
  authDomain: "mark-lynx-admin.firebaseapp.com",
  projectId: "mark-lynx-admin",
  storageBucket: "mark-lynx-admin.firebasestorage.app",
  messagingSenderId: "749999035332",
  appId: "1:749999035332:web:52c78e6e358c1fef794a91"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const login = document.getElementById("login");
const admin = document.getElementById("admin");
const form = document.getElementById("loginForm");
const error = document.getElementById("error");

function loggedOut(){admin.style.display="none";login.style.display="block";}
function loggedIn(){login.style.display="none";admin.style.display="block";form.reset();error.textContent="";}

await setPersistence(auth,browserLocalPersistence);
onAuthStateChanged(auth,user=>user?loggedIn():loggedOut());

form.addEventListener("submit",async e=>{
  e.preventDefault(); error.textContent="";
  try{
    await signInWithEmailAndPassword(auth,
      document.getElementById("email").value.trim(),
      document.getElementById("password").value);
  }catch(e){error.textContent="Invalid email or password.";}
});

document.getElementById("logout").addEventListener("click",()=>signOut(auth));
</script>
</body>
</html>

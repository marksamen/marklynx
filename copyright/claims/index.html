<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Copyright Claims — Mark Lynx Admin</title>
<style>
html,body{min-height:100%;margin:0;font-family:Arial,sans-serif;background:#111;color:#fff}
body{display:grid;place-items:center}
main{box-sizing:border-box;width:min(92vw,720px);padding:2rem;text-align:center}
#checking{opacity:.7}
#claims{display:none}
h1{margin:0 0 .35rem}
p{margin:.35rem 0;opacity:.7}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:1.5rem}
a,button{box-sizing:border-box;width:100%;padding:.85rem 1rem;border:0;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}
a{display:block;background:#fff;color:#111;text-decoration:none}
button{background:#d9d9d9;color:#111}
@media(max-width:600px){main{padding:1.25rem}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<main id="checking">Checking authorization…</main>
<main id="claims">
<h1>Copyright Claims</h1>
<p>MARK LYNX ADMIN</p>
<p>Copyright claim management will be built here.</p>
<div class="actions">
<a href="../">Back to Admin</a>
<button id="logout" type="button">Sign Out</button>
</div>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { getAuth, setPersistence, browserLocalPersistence, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAyaoxwg1-Ru821Y6ohRxwT_DL3bsO8zfQ",
  authDomain: "mark-lynx-admin.firebaseapp.com",
  projectId: "mark-lynx-admin",
  storageBucket: "mark-lynx-admin.firebasestorage.app",
  messagingSenderId: "749999035332",
  appId: "1:749999035332:web:52c78e6e358c1fef794a91"
};

const auth = getAuth(initializeApp(firebaseConfig));
const checking = document.getElementById("checking");
const claims = document.getElementById("claims");

await setPersistence(auth,browserLocalPersistence);
onAuthStateChanged(auth,user=>{
  if(!user){ location.replace("../"); return; }
  checking.style.display="none";
  claims.style.display="block";
});

document.getElementById("logout").addEventListener("click",async()=>{
  await signOut(auth);
  location.replace("../");
});
</script>
</body>
</html>

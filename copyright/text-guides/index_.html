<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>(TEST) Text Guide Management</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#111113;color:#fff}body{padding:24px}.wrap{width:min(900px,100%);margin:auto}.panel{background:#19191b;border:1px solid #35353a;border-radius:12px;padding:18px;margin-bottom:18px}h1{margin:0 0 6px}p{color:#aaa}.list{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:14px;background:#141416;border:1px solid #303034;border-radius:10px}.name{font-weight:800}.meta{margin-top:5px;color:#aaa;font-size:.86rem}.actions{display:flex;gap:8px}button,input{font:inherit;border-radius:8px}button{border:1px solid #4a4a4f;background:#252529;color:#fff;padding:9px 12px;font-weight:700;cursor:pointer}.danger{background:#3b1717;border-color:#713030}.add{background:#198754;border-color:#2a9d66}.form{display:flex;gap:10px}.form input{flex:1;padding:11px 12px;border:1px solid #4a4a4f;background:#111113;color:#fff}.modal{position:fixed;inset:0;display:none;background:rgba(0,0,0,.72);align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.card{width:min(92vw,540px);padding:22px;border:1px solid #4a4a4f;border-radius:12px;background:#171717}.card.error{border-top:3px solid #b64040}.card input{width:100%;margin-top:12px;padding:11px 12px;background:#111113;color:#fff;border:1px solid #4a4a4f;border-radius:8px}.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}@media(max-width:650px){body{padding:12px}.row{grid-template-columns:1fr}.actions,.form{flex-wrap:wrap}.form input{min-width:100%}}</style></head><body>
<div class="wrap"><h1>Text Guide Management</h1><p>Add, edit, or delete the Text Guide values available in Game Management.</p>
<section class="panel"><h2>Current Text Guides</h2><div id="status" class="meta">Loading from Supabase TEST…</div><div id="list" class="list"></div></section>
<section class="panel"><h2>Add Text Guide</h2><div class="form"><input id="newValue" maxlength="160" placeholder="Example: Text Guide Included (All Cats Circled)"><button id="add" class="add" type="button">Add Text Guide</button></div></section></div>
<div id="modal" class="modal" aria-hidden="true"><div id="card" class="card"><h2 id="title"></h2><p id="message"></p><input id="editValue" maxlength="160" style="display:none"><div class="modal-actions"><button id="cancel" type="button">Cancel</button><button id="ok" type="button">OK</button></div></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";import {getAuth,setPersistence,browserLocalPersistence,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyAyaoxwg1-Ru821Y6ohRxwT_DL3bsO8zfQ",authDomain:"mark-lynx-admin.firebaseapp.com",projectId:"mark-lynx-admin",storageBucket:"mark-lynx-admin.firebasestorage.app",messagingSenderId:"749999035332",appId:"1:749999035332:web:52c78e6e358c1fef794a91"};
const URL="https://aikifibkcjibubqegvmb.supabase.co",KEY="sb_publishable_AMeGQySg9vDaKqkZRz_7HQ_yveiHHV_";const auth=getAuth(initializeApp(firebaseConfig));let user=null,pending=null;
async function callAdmin(payload){if(!user)throw new Error("Admin authentication is required.");const token=await user.getIdToken();const r=await fetch(`${URL}/functions/v1/games-admin`,{method:"POST",headers:{Authorization:`Bearer ${token}`,"Content-Type":"application/json"},body:JSON.stringify(payload)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||`Supabase TEST returned HTTP ${r.status}.`);return j;}
async function load(){const [o,g]=await Promise.all([fetch(`${URL}/rest/v1/text_guide_options?select=id,value,sort_order&order=sort_order.asc,value.asc`,{headers:{apikey:KEY},cache:"no-store"}),fetch(`${URL}/rest/v1/games?select=tx`,{headers:{apikey:KEY},cache:"no-store"})]);if(!o.ok||!g.ok)throw new Error(`Supabase TEST read failed (${o.status}/${g.status}).`);const rows=await o.json(),games=await g.json(),usage=new Map();for(const game of games){const v=String(game?.tx||"").trim();if(v)usage.set(v,(usage.get(v)||0)+1);}document.getElementById("list").replaceChildren(...rows.map(row=>render(row,usage.get(String(row.value).trim())||0)));document.getElementById("status").textContent=`Loaded ${rows.length} Text Guide entr${rows.length===1?"y":"ies"} with live game usage.`;}
function render(row,count){const a=document.createElement("article");a.className="row";const d=document.createElement("div");d.innerHTML=`<div class="name"></div><div class="meta">Usage count: ${count}</div>`;d.querySelector(".name").textContent=row.value;const actions=document.createElement("div");actions.className="actions";const e=document.createElement("button");e.textContent="Edit";e.onclick=()=>openEdit(row,count);const del=document.createElement("button");del.className="danger";del.textContent="Delete";del.onclick=()=>openDelete(row,count);actions.append(e,del);a.append(d,actions);return a;}
const modal=document.getElementById("modal"),card=document.getElementById("card"),title=document.getElementById("title"),message=document.getElementById("message"),edit=document.getElementById("editValue"),cancel=document.getElementById("cancel"),ok=document.getElementById("ok");
function show(t,m,error=false){pending=null;title.textContent=t;message.textContent=m;edit.style.display="none";cancel.style.display="none";ok.textContent="OK";card.classList.toggle("error",error);modal.classList.add("open");}
function openEdit(row,count){pending={type:"edit",row};cancel.style.display="";title.textContent="Edit Text Guide";message.textContent=`This Text Guide is assigned to ${count} game${count===1?"":"s"}. Renaming it will update every assigned game.`;edit.value=row.value;edit.style.display="block";ok.textContent="Save Changes";card.classList.remove("error");modal.classList.add("open");edit.focus();}
function openDelete(row,count){if(count>0){show("Text Guide In Use",`${row.value} is currently assigned to ${count} game${count===1?"":"s"}. Change those games to another Text Guide before deleting it.`,true);return;}pending={type:"delete",row};cancel.style.display="";title.textContent="Delete Text Guide?";message.textContent=`Delete ${row.value}?`;edit.style.display="none";ok.textContent="Delete";card.classList.add("error");modal.classList.add("open");}
function close(){pending=null;modal.classList.remove("open");edit.style.display="none";cancel.style.display="";ok.textContent="OK";}
document.getElementById("cancel").onclick=close;ok.onclick=async()=>{if(!pending){close();return;}ok.disabled=true;try{if(pending.type==="edit"){const value=edit.value.trim();if(!value){edit.focus();return;}const old=pending.row.value;const r=await callAdmin({action:"rename-text-guide",id:pending.row.id,new_value:value});close();await load();parent.postMessage({type:"text-guides-updated"},location.origin);show("Text Guide Updated",`${old} was renamed to ${r.option.value}. ${r.updated_games} game${r.updated_games===1?"":"s"} updated.`);}else{const old=pending.row.value;await callAdmin({action:"delete-text-guide",id:pending.row.id});close();await load();parent.postMessage({type:"text-guides-updated"},location.origin);show("Text Guide Deleted",`${old} was deleted.`);}}catch(e){close();show("Text Guide Change Rejected",e.message||String(e),true);}finally{ok.disabled=false;}};
document.getElementById("add").onclick=async()=>{const input=document.getElementById("newValue"),value=input.value.trim();if(!value){input.focus();return;}try{await callAdmin({action:"add-text-guide",value});input.value="";await load();parent.postMessage({type:"text-guides-updated"},location.origin);show("Text Guide Added",`${value} was added.`);}catch(e){show("Text Guide Not Added",e.message||String(e),true);}};
await setPersistence(auth,browserLocalPersistence);onAuthStateChanged(auth,u=>{user=u;if(u)load().catch(e=>show("Text Guide Load Failed",e.message||String(e),true));else show("Authentication Required","Sign in to the main TEST Admin first, then reopen Text Guide Management.",true);});
</script></body></html>

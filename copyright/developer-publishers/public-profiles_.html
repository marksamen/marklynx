<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/copyright/favicon_.ico" type="image/x-icon"><title>Public Developer Profiles — Mark Lynx Admin</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#111;color:#fff}body{padding:24px}main{width:min(900px,100%);margin:0 auto}h1{margin:0 0 .35rem;font-size:clamp(1.6rem,4vw,2.25rem)}.subtitle{margin:.35rem 0 22px;color:#aaa}input,textarea,select{width:100%;border:1px solid #555;border-radius:8px;background:#1b1b1b;color:#fff;padding:.75rem .85rem;font:inherit}.status{min-height:20px;color:#aaa;font-size:.88rem}.results{display:grid;gap:10px;margin-top:14px}.company-row{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:14px;border:1px solid #3d3d42;border-radius:10px;background:#18181a}.company-name{font-weight:800}.company-meta{margin-top:5px;color:#999;font-size:.82rem}.edit-profile{border:1px solid #7a4ca3;border-radius:8px;padding:.7rem .9rem;background:#5b347e;color:#fff;font:inherit;font-weight:800;cursor:pointer}.edit-profile:hover{background:#704294}.modal{position:fixed;inset:0;z-index:1000;display:none;background:rgba(0,0,0,.72)}.modal.open{display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(92vw,720px);max-height:90vh;overflow:auto;padding:22px;border:1px solid #4a4a4f;border-top:3px solid #7a4ca3;border-radius:12px;background:#171717;box-shadow:0 18px 60px rgba(0,0,0,.65)}.card h2{margin:0 0 16px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.form label{display:grid;gap:7px;font-weight:700;color:#ddd}.form .wide{grid-column:1/-1}.form textarea{min-height:150px;resize:vertical}.locked{color:#aaa}.toggle{display:flex!important;grid-template-columns:auto 1fr!important;align-items:center;gap:10px!important}.toggle input{width:auto}.help{font-size:.8rem;font-weight:400;color:#888}.provided-games{margin:0;padding:10px 12px;border:1px solid #3d3d42;border-radius:8px;background:#121214;color:#ddd}.provided-games div+div{margin-top:7px}.actions{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}.actions button{min-height:42px;border:1px solid #4a4a4f;border-radius:8px;background:#242426;color:#fff;font-weight:800;cursor:pointer}.actions .save{border-color:#7a4ca3;background:#5b347e}.edit-status{grid-column:1/-1;min-height:20px;margin:0;color:#aaa;font-size:.88rem}@media(max-width:600px){body{padding:14px}.company-row{grid-template-columns:1fr}.form{grid-template-columns:1fr}.form .wide,.actions,.edit-status{grid-column:auto}.actions{grid-template-columns:1fr}}
</style></head><body><main><h1>Public Developer Profiles</h1><p class="subtitle">Controls public-facing developer profile data for youtube.marklynx.com. Nothing is public unless Public Profile Enabled is checked.</p><input id="search" type="search" placeholder="Search developer or publisher…" autocomplete="off"><p id="status" class="status">Checking Admin authentication…</p><div id="results" class="results"></div></main>
<div id="modal" class="modal" aria-hidden="true"><div class="card" role="dialog" aria-modal="true"><h2 id="title">Public Developer Profile</h2><div class="form"><label class="wide">Official Name<input id="officialName" class="locked" type="text" readonly></label><label class="wide toggle"><input id="enabled" type="checkbox"><span>Public Profile Enabled</span></label><label>Public Display Name<input id="displayName" type="text" autocomplete="off"><span class="help">Optional. Leave blank to use Official Name.</span></label><label>Public Display Order<input id="displayOrder" type="number" min="0" step="1"><span class="help">Optional whole number. Lower numbers appear first.</span></label><label>YouTube Game Order<select id="gamesSort"><option value="RECENT">Recent</option><option value="ALPHABETICAL">Alphabetical</option></select><span class="help">Private Admin setting controlling game order on the public Developer profile.</span></label><label class="wide">Public Description<textarea id="description"></textarea></label><label class="wide">Provided Games <span id="providedCount" class="help"></span><div id="providedGames" class="provided-games">Loading…</div><span class="help">Read-only in this revision. Admin display is always alphabetical A–Z.</span></label><p id="editStatus" class="edit-status"></p><div class="actions"><button id="save" class="save" type="button">Save Public Profile</button><button id="cancel" type="button">Cancel</button></div></div></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { getAuth, setPersistence, browserLocalPersistence, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyAyaoxwg1-Ru821Y6ohRxwT_DL3bsO8zfQ",authDomain:"mark-lynx-admin.firebaseapp.com",projectId:"mark-lynx-admin",storageBucket:"mark-lynx-admin.firebasestorage.app",messagingSenderId:"749999035332",appId:"1:749999035332:web:52c78e6e358c1fef794a91"};
const SUPABASE_TEST_URL="https://aikifibkcjibubqegvmb.supabase.co";
const app=initializeApp(firebaseConfig),auth=getAuth(app);await setPersistence(auth,browserLocalPersistence);
const search=document.getElementById("search"),status=document.getElementById("status"),results=document.getElementById("results"),modal=document.getElementById("modal"),officialName=document.getElementById("officialName"),enabled=document.getElementById("enabled"),displayName=document.getElementById("displayName"),displayOrder=document.getElementById("displayOrder"),gamesSort=document.getElementById("gamesSort"),providedCount=document.getElementById("providedCount"),providedGames=document.getElementById("providedGames"),description=document.getElementById("description"),editStatus=document.getElementById("editStatus"),save=document.getElementById("save"),cancel=document.getElementById("cancel");let currentUser=null,companies=[],editing=null;
async function callAdmin(body){const token=await currentUser.getIdToken();const response=await fetch(`${SUPABASE_TEST_URL}/functions/v1/games-admin`,{method:"POST",headers:{Authorization:`Bearer ${token}`,"Content-Type":"application/json"},body:JSON.stringify(body)});const result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.error||`Supabase TEST returned HTTP ${response.status}.`);return result;}
function render(){const q=search.value.trim().toLowerCase();results.innerHTML="";if(!q){status.textContent=`${companies.length} companies loaded from Supabase TEST. Type a name to configure its public profile.`;return;}const matches=companies.filter(c=>String(c.official_name||"").toLowerCase().includes(q));status.textContent=matches.length?`${matches.length} matching compan${matches.length===1?"y":"ies"}.`:"No matching companies.";for(const c of matches){const row=document.createElement("div");row.className="company-row";const info=document.createElement("div"),name=document.createElement("div"),meta=document.createElement("div"),button=document.createElement("button");name.className="company-name";name.textContent=`${c.id} — ${c.official_name}`;meta.className="company-meta";meta.textContent=c.public_profile_enabled?`PUBLIC ENABLED${c.public_display_name?` • ${c.public_display_name}`:""}`:"Public profile disabled";button.className="edit-profile";button.type="button";button.textContent="Public Profile";button.addEventListener("click",()=>open(c));info.append(name,meta);row.append(info,button);results.append(row);}}
async function open(c){editing=c;officialName.value=c.official_name||"";enabled.checked=c.public_profile_enabled===true;displayName.value=c.public_display_name||"";displayOrder.value=c.public_display_order??"";gamesSort.value=c.public_games_sort||"RECENT";providedCount.textContent="";providedGames.textContent="Loading…";description.value=c.public_description||"";editStatus.textContent="";modal.classList.add("open");modal.setAttribute("aria-hidden","false");enabled.focus();try{const result=await callAdmin({action:"list-provided-games",id:c.id});const games=result.games||[];providedCount.textContent=`(${games.length})`;providedGames.innerHTML="";if(!games.length){providedGames.textContent="No provided games assigned.";}else{for(const game of games){const row=document.createElement("div");row.textContent=`${game.id} — ${game.name}`;providedGames.append(row);}}}catch(error){providedCount.textContent="";providedGames.textContent=`LOAD FAILED — ${error?.message||error}`;} }
function close(){editing=null;modal.classList.remove("open");modal.setAttribute("aria-hidden","true");}
cancel.addEventListener("click",close);search.addEventListener("input",render);
save.addEventListener("click",async()=>{if(!currentUser||!editing)return;const profile={id:editing.id,public_profile_enabled:enabled.checked,public_display_name:displayName.value.trim(),public_description:description.value.trim(),public_display_order:displayOrder.value,public_games_sort:gamesSort.value};save.disabled=true;editStatus.textContent="Saving public profile to Supabase TEST…";try{const result=await callAdmin({action:"update-public-profile",profile});const updated=result.company;companies=companies.map(c=>c.id===updated.id?{...c,...updated}:c);close();render();status.textContent=`UPDATED — ${updated.official_name} public profile saved to Supabase TEST.`;}catch(error){editStatus.textContent=`UPDATE FAILED — Supabase TEST was not changed. ${error?.message||error}`;console.error("Public Developer Profile TEST update failed:",error);}finally{save.disabled=false;}});
onAuthStateChanged(auth,async user=>{currentUser=user;if(!user){status.textContent="Admin authentication required.";return;}status.textContent="Loading companies from Supabase TEST…";try{const result=await callAdmin({action:"list-companies"});companies=result.companies||[];render();}catch(error){status.textContent=`LOAD FAILED — ${error?.message||error}`;console.error("Public Developer Profiles TEST load failed:",error);}});
</script></body></html>

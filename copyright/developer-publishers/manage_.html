<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/copyright/favicon_.ico" type="image/x-icon"><title>Manage Developer / Publisher — Mark Lynx Admin</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#111;color:#fff}body{padding:24px}main{width:min(900px,100%);margin:0 auto}h1{margin:0 0 .35rem;font-size:clamp(1.6rem,4vw,2.25rem)}.subtitle{margin:.35rem 0 22px;color:#aaa}input{width:100%;border:1px solid #555;border-radius:8px;background:#1b1b1b;color:#fff;padding:.75rem .85rem;font:inherit}.status{min-height:20px;color:#aaa;font-size:.88rem}.relationship-filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}.relationship-filter{border:1px solid #4a4a4f;border-radius:8px;padding:.6rem .8rem;background:#242426;color:#fff;font:inherit;font-size:.84rem;font-weight:800;cursor:pointer}.relationship-filter:hover{background:#303034}.relationship-filter.active{border-color:#285784;background:#173a63}.results{display:grid;gap:10px;margin-top:14px}.company-row{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:14px;border:1px solid #3d3d42;border-radius:10px;background:#18181a}.company-name{font-weight:800}.company-meta{margin-top:5px;color:#999;font-size:.82rem}.row-actions{display:flex;gap:8px}.view-games{border:1px solid #4b6b3c;border-radius:8px;padding:.7rem .9rem;background:#304a27;color:#fff;font:inherit;font-weight:800;cursor:pointer}.view-games:hover{background:#3c5b31}.edit-company{border:1px solid #285784;border-radius:8px;padding:.7rem .9rem;background:#173a63;color:#fff;font:inherit;font-weight:800;cursor:pointer}.edit-company:hover{background:#214c7c}.delete-company{border:1px solid #8a3030;border-radius:8px;padding:.7rem .9rem;background:#5a1f1f;color:#fff;font:inherit;font-weight:800;cursor:pointer}.delete-company:hover{background:#6d2626}.delete-company:disabled{opacity:.55;cursor:not-allowed}.modal{position:fixed;inset:0;z-index:1000;display:none;background:rgba(0,0,0,.72)}.modal.open{display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(92vw,520px);padding:22px;border:1px solid #4a4a4f;border-top:3px solid #8a3030;border-radius:12px;background:#171717;box-shadow:0 18px 60px rgba(0,0,0,.65)}.card h2{margin:0 0 12px}.card p{color:#d7d7d7;line-height:1.5}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.actions button{min-height:42px;border:1px solid #4a4a4f;border-radius:8px;background:#242426;color:#fff;font-weight:800;cursor:pointer}.actions .danger{border-color:#8a3030;background:#5a1f1f}.actions button:hover{background:#303034}.actions .danger:hover{background:#6d2626}@media(max-width:600px){body{padding:14px}.company-row{grid-template-columns:1fr}.row-actions{display:grid;grid-template-columns:1fr 1fr 1fr}.view-games,.edit-company,.delete-company{width:100%}.actions{grid-template-columns:1fr}}

.edit-card{width:min(92vw,720px);max-height:90vh;overflow:auto;padding:22px;border:1px solid #4a4a4f;border-top:3px solid #285784;border-radius:12px;background:#171717;box-shadow:0 18px 60px rgba(0,0,0,.65)}
.edit-card h2{margin:0 0 16px}.edit-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.edit-form label{display:grid;gap:7px;font-weight:700;color:#ddd}.edit-form .wide{grid-column:1/-1}.edit-form input,.edit-form select,.edit-form textarea{width:100%;border:1px solid #555;border-radius:8px;background:#1b1b1b;color:#fff;padding:.75rem .85rem;font:inherit}.edit-form textarea{min-height:110px;resize:vertical}.edit-help{font-size:.8rem;font-weight:400;color:#888}.edit-actions{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}.edit-actions button{min-height:42px;border:1px solid #4a4a4f;border-radius:8px;background:#242426;color:#fff;font-weight:800;cursor:pointer}.edit-actions .save{border-color:#285784;background:#173a63}.edit-status{grid-column:1/-1;min-height:20px;margin:0;color:#aaa;font-size:.88rem}@media(max-width:600px){.edit-form{grid-template-columns:1fr}.edit-form .wide,.edit-actions,.edit-status{grid-column:auto}.edit-actions{grid-template-columns:1fr}}

.result-modal{position:fixed;inset:0;z-index:1001;display:none;background:rgba(0,0,0,.72)}
.result-modal.open{display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.result-card{box-sizing:border-box;width:min(92vw,520px);margin:auto;padding:22px;border:1px solid #4a4a4f;border-top:3px solid #2e7d32;border-radius:12px;background:#171717;box-shadow:0 18px 60px rgba(0,0,0,.65);text-align:left}
.result-card.error{border-top-color:#b64040}
.result-card h2{margin:0 0 12px;color:#fff;font-size:1.15rem}
.result-card p{margin:0;color:#d7d7d7;font-size:.9rem;line-height:1.5}
.result-actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:18px}
.result-actions button{min-height:42px;border:1px solid #4a4a4f;border-radius:8px;background:#242426;color:#fff;font-weight:800;cursor:pointer}
.result-actions button:hover{background:#303034}
.games-card{width:min(92vw,700px);max-height:85vh;overflow:auto;padding:22px;border:1px solid #4a4a4f;border-top:3px solid #4b6b3c;border-radius:12px;background:#171717;box-shadow:0 18px 60px rgba(0,0,0,.65)}.games-card h2{margin:0 0 8px}.games-subtitle{margin:0 0 16px;color:#aaa}.linked-games{display:grid;gap:8px}.linked-game{padding:12px;border:1px solid #3d3d42;border-radius:8px;background:#1d1d1f}.linked-game-name{font-weight:800}.linked-game-meta{margin-top:4px;color:#aaa;font-size:.85rem}.games-close{width:100%;min-height:42px;margin-top:18px;border:1px solid #4a4a4f;border-radius:8px;background:#242426;color:#fff;font-weight:800;cursor:pointer}.games-close:hover{background:#303034}
</style></head><body><main><h1>Manage Developer / Publisher</h1><p class="subtitle">Search the Supabase TEST company list. Delete is blocked when a company is attached to a game.</p><input id="companySearch" type="search" placeholder="Search company or developer…" autocomplete="off" aria-label="Search developer or publisher company"><div id="relationshipFilters" class="relationship-filters" aria-label="Filter by relationship status"></div><p id="companyStatus" class="status" aria-live="polite">Checking Admin authentication…</p><div id="companyResults" class="results"></div></main>
<div id="gamesModal" class="modal" aria-hidden="true"><div class="games-card" role="dialog" aria-modal="true" aria-labelledby="gamesTitle"><h2 id="gamesTitle">Linked Games</h2><p id="gamesSubtitle" class="games-subtitle"></p><div id="linkedGames" class="linked-games"></div><button id="gamesClose" class="games-close" type="button">Close</button></div></div>
<div id="editModal" class="modal" aria-hidden="true"><div class="edit-card" role="dialog" aria-modal="true" aria-labelledby="editTitle"><h2 id="editTitle">Edit Developer / Publisher</h2><div class="edit-form">
<label class="wide">Official Name<input id="editOfficialName" type="text" readonly><span class="edit-help">Official Name is locked in this TEST step so existing game relationships cannot be broken by a rename.</span></label>
<label>Company Type<select id="editCompanyType"><option value="Developer">Developer</option><option value="Publisher">Publisher</option><option value="Developer + Publisher">Developer + Publisher</option><option value="Solo Developer">Solo Developer</option></select></label>
<label>Country / Location<input id="editCountry" type="text" autocomplete="off"></label>
<label>Website URL<input id="editWebsite" type="url" autocomplete="off" placeholder="https://"></label>
<label>Relationship Status<select id="editRelationshipStatus"><option value="NOT_CONTACTED">Not Contacted</option><option value="WAITING_FOR_RESPONSE">Waiting for Response</option><option value="ACTIVE_RELATIONSHIP">Active Relationship</option><option value="DO_NOT_CONTACT">Do Not Contact</option></select></label>
<label id="editFirstDateLabel">First Contact Date<input id="editFirstContactDate" type="date"></label>
<label id="editLastDateLabel">Last Contact Date<input id="editLastContactDate" type="date"></label>
<label class="wide">Relationship Notes<textarea id="editNotes"></textarea></label>
<p id="editStatus" class="edit-status" aria-live="polite"></p><div class="edit-actions"><button id="editSave" class="save" type="button">Save Changes</button><button id="editCancel" type="button">Cancel</button></div>
</div></div></div>
<div id="deleteModal" class="modal" aria-hidden="true"><div class="card" role="dialog" aria-modal="true" aria-labelledby="deleteTitle"><h2 id="deleteTitle">Delete Developer / Publisher?</h2><p id="deleteMessage"></p><div class="actions"><button id="deleteConfirm" class="danger" type="button">Yes — Delete</button><button id="deleteCancel" type="button">Cancel</button></div></div></div>
<div id="resultModal" class="result-modal" aria-hidden="true"><div id="resultCard" class="result-card" role="dialog" aria-modal="true" aria-labelledby="resultTitle"><h2 id="resultTitle">Developer / Publisher</h2><p id="resultMessage"></p><div class="result-actions"><button id="resultOk" type="button">OK</button></div></div></div><script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { getAuth, setPersistence, browserLocalPersistence, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyAyaoxwg1-Ru821Y6ohRxwT_DL3bsO8zfQ",authDomain:"mark-lynx-admin.firebaseapp.com",projectId:"mark-lynx-admin",storageBucket:"mark-lynx-admin.firebasestorage.app",messagingSenderId:"749999035332",appId:"1:749999035332:web:52c78e6e358c1fef794a91"};
const SUPABASE_TEST_URL="https://aikifibkcjibubqegvmb.supabase.co";
const app=initializeApp(firebaseConfig);const auth=getAuth(app);await setPersistence(auth,browserLocalPersistence);
const search=document.getElementById("companySearch"),relationshipFilters=document.getElementById("relationshipFilters"),status=document.getElementById("companyStatus"),results=document.getElementById("companyResults"),modal=document.getElementById("deleteModal"),message=document.getElementById("deleteMessage"),confirmButton=document.getElementById("deleteConfirm"),cancelButton=document.getElementById("deleteCancel");const editModal=document.getElementById("editModal"),editOfficialName=document.getElementById("editOfficialName"),editCompanyType=document.getElementById("editCompanyType"),editCountry=document.getElementById("editCountry"),editWebsite=document.getElementById("editWebsite"),editRelationshipStatus=document.getElementById("editRelationshipStatus"),editFirstContactDate=document.getElementById("editFirstContactDate"),editLastContactDate=document.getElementById("editLastContactDate"),editFirstDateLabel=document.getElementById("editFirstDateLabel"),editLastDateLabel=document.getElementById("editLastDateLabel"),editNotes=document.getElementById("editNotes"),editStatus=document.getElementById("editStatus"),editSave=document.getElementById("editSave"),editCancel=document.getElementById("editCancel");const gamesModal=document.getElementById("gamesModal"),gamesTitle=document.getElementById("gamesTitle"),gamesSubtitle=document.getElementById("gamesSubtitle"),linkedGames=document.getElementById("linkedGames"),gamesClose=document.getElementById("gamesClose");let currentUser=null,companies=[],pendingCompany=null,editingCompany=null,relationshipFilter="ALL";
const RELATIONSHIP_FILTERS=[
  ["ALL","All"],
  ["ACTIVE_RELATIONSHIP","Active Relationship"],
  ["WAITING_FOR_RESPONSE","Waiting for Response"],
  ["NOT_CONTACTED","Not Contacted"],
  ["DO_NOT_CONTACT","Do Not Contact"]
];
async function callAdmin(body){const token=await currentUser.getIdToken();const response=await fetch(`${SUPABASE_TEST_URL}/functions/v1/games-admin`,{method:"POST",headers:{Authorization:`Bearer ${token}`,"Content-Type":"application/json"},body:JSON.stringify(body)});const result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.error||`Supabase TEST returned HTTP ${response.status}.`);return result;}
function renderRelationshipFilters(){relationshipFilters.innerHTML="";for(const [value,label] of RELATIONSHIP_FILTERS){const count=value==="ALL"?companies.length:companies.filter(c=>c.relationship_status===value).length;const button=document.createElement("button");button.type="button";button.className=`relationship-filter${relationshipFilter===value?" active":""}`;button.textContent=`${label} (${count})`;button.addEventListener("click",()=>{relationshipFilter=value;render();});relationshipFilters.appendChild(button);}}
function render(){const q=search.value.trim().toLowerCase();results.innerHTML="";renderRelationshipFilters();let matches=companies.filter(c=>relationshipFilter==="ALL"||c.relationship_status===relationshipFilter);if(q)matches=matches.filter(c=>String(c.official_name||"").toLowerCase().includes(q));matches.sort((a,b)=>String(a.official_name||"").localeCompare(String(b.official_name||""),undefined,{sensitivity:"base",numeric:true})||Number(a.id)-Number(b.id));if(relationshipFilter==="ALL"&&!q){status.textContent=`${companies.length} companies loaded from Supabase TEST. Choose a relationship status or type a name to manage one.`;return;}const filterLabel=RELATIONSHIP_FILTERS.find(([value])=>value===relationshipFilter)?.[1]||"All";status.textContent=matches.length?`${matches.length} compan${matches.length===1?"y":"ies"}${relationshipFilter!=="ALL"?` — ${filterLabel}`:""}${q?" matching search":""}.`:`No companies${relationshipFilter!=="ALL"?` — ${filterLabel}`:""}${q?" matching search":""}.`;for(const company of matches){const row=document.createElement("div");row.className="company-row";const info=document.createElement("div");const name=document.createElement("div");name.className="company-name";name.textContent=`${company.id} — ${company.official_name}`;const meta=document.createElement("div");meta.className="company-meta";meta.textContent=`${company.company_type||"No type"} • ${company.relationship_status||"No relationship status"}`;info.append(name,meta);const buttons=document.createElement("div");buttons.className="row-actions";const view=document.createElement("button");view.type="button";view.className="view-games";view.textContent=`View Games (${company.game_count??0})`;view.addEventListener("click",()=>openGames(company));const edit=document.createElement("button");edit.type="button";edit.className="edit-company";edit.textContent="Edit";edit.addEventListener("click",()=>openEdit(company));const del=document.createElement("button");del.type="button";del.className="delete-company";del.textContent="Delete";del.addEventListener("click",()=>openDelete(company));buttons.append(view,edit,del);row.append(info,buttons);results.appendChild(row);}}
async function openGames(company){gamesTitle.textContent=`Games — ${company.official_name}`;gamesSubtitle.textContent=`Company ID ${company.id} • ${company.game_count??0} linked game${Number(company.game_count??0)===1?"":"s"}`;linkedGames.innerHTML="";const loading=document.createElement("div");loading.className="linked-game";loading.textContent="Loading linked games from Supabase TEST…";linkedGames.appendChild(loading);gamesModal.classList.add("open");gamesModal.setAttribute("aria-hidden","false");try{const result=await callAdmin({action:"list-company-games",id:company.id});linkedGames.innerHTML="";const games=result.games||[];if(!games.length){const empty=document.createElement("div");empty.className="linked-game";empty.textContent="No games are linked to this company.";linkedGames.appendChild(empty);}else{const grouped=new Map();for(const game of games){const id=Number(game.id);if(!grouped.has(id))grouped.set(id,{id,name:game.name,roles:[]});const entry=grouped.get(id);const role=game.role||"Unknown role";if(!entry.roles.includes(role))entry.roles.push(role);}for(const game of [...grouped.values()].sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),undefined,{sensitivity:"base",numeric:true})||a.id-b.id)){const item=document.createElement("div");item.className="linked-game";const name=document.createElement("div");name.className="linked-game-name";name.textContent=`${game.id} — ${game.name}`;const meta=document.createElement("div");meta.className="linked-game-meta";meta.textContent=game.roles.join(" + ");item.append(name,meta);linkedGames.appendChild(item);}}}catch(error){linkedGames.innerHTML="";const item=document.createElement("div");item.className="linked-game";item.textContent=`LOAD FAILED — ${error?.message||error}`;linkedGames.appendChild(item);console.error("Developer / Publisher linked games TEST load failed:",error);}}
function closeGames(){gamesModal.classList.remove("open");gamesModal.setAttribute("aria-hidden","true");}
gamesClose.addEventListener("click",closeGames);
function updateEditDateVisibility(){const hidden=editRelationshipStatus.value==="NOT_CONTACTED";editFirstDateLabel.hidden=hidden;editLastDateLabel.hidden=hidden;}
function openEdit(company){editingCompany=company;editOfficialName.value=company.official_name||"";editCompanyType.value=company.company_type||"";editCountry.value=company.country||"";editWebsite.value=company.website_url||"";editRelationshipStatus.value=company.relationship_status||"NOT_CONTACTED";editFirstContactDate.value=company.first_contact_date||"";editLastContactDate.value=company.last_contact_date||"";editNotes.value=company.relationship_notes||"";editStatus.textContent="";updateEditDateVisibility();editModal.classList.add("open");editModal.setAttribute("aria-hidden","false");editCompanyType.focus();}
function closeEdit(){editingCompany=null;editModal.classList.remove("open");editModal.setAttribute("aria-hidden","true");}
editRelationshipStatus.addEventListener("change",updateEditDateVisibility);editCancel.addEventListener("click",closeEdit);
editSave.addEventListener("click",async()=>{if(!currentUser||!editingCompany)return;const company={id:editingCompany.id,official_name:editingCompany.official_name,company_type:editCompanyType.value,country:editCountry.value.trim(),website_url:editWebsite.value.trim(),relationship_status:editRelationshipStatus.value,first_contact_date:editFirstContactDate.value,last_contact_date:editLastContactDate.value,relationship_notes:editNotes.value.trim()};if(!company.company_type){editStatus.textContent="Company Type is required.";return;}editSave.disabled=true;editStatus.textContent="Saving changes to Supabase TEST…";try{const result=await callAdmin({action:"update-company",company});const updated=result.company;companies=companies.map(c=>c.id===updated.id?updated:c);closeEdit();render();status.textContent=`UPDATED — ${updated.official_name} saved to Supabase TEST.`;showResult("Developer / Publisher Updated",`${updated.official_name} was updated in Supabase TEST successfully.`);}catch(error){const errorMessage=error?.message||String(error);editStatus.textContent=`UPDATE FAILED — Supabase TEST was not changed. ${errorMessage}`;console.error("Developer / Publisher TEST update failed:",error);}finally{editSave.disabled=false;}});
function openDelete(company){pendingCompany=company;message.textContent=`Permanently delete ${company.id} — ${company.official_name} from Supabase TEST?`;modal.classList.add("open");modal.setAttribute("aria-hidden","false");confirmButton.focus();}function closeDelete(){pendingCompany=null;modal.classList.remove("open");modal.setAttribute("aria-hidden","true");}
cancelButton.addEventListener("click",closeDelete);search.addEventListener("input",render);const resultModal=document.getElementById("resultModal"),resultCard=document.getElementById("resultCard"),resultTitle=document.getElementById("resultTitle"),resultMessage=document.getElementById("resultMessage"),resultOk=document.getElementById("resultOk");
function showResult(title,text,isError=false){resultTitle.textContent=title;resultMessage.textContent=text;resultCard.classList.toggle("error",isError);resultModal.classList.add("open");resultModal.setAttribute("aria-hidden","false");resultOk.focus();}
resultOk.addEventListener("click",()=>{resultModal.classList.remove("open");resultModal.setAttribute("aria-hidden","true");});

confirmButton.addEventListener("click",async()=>{if(!currentUser||!pendingCompany)return;const company=pendingCompany;confirmButton.disabled=true;status.textContent=`Deleting ${company.official_name} from Supabase TEST…`;try{await callAdmin({action:"delete-company",id:company.id});companies=companies.filter(c=>c.id!==company.id);closeDelete();render();status.textContent=`DELETED — ${company.official_name} removed from Supabase TEST.`;showResult("Developer / Publisher Deleted",`${company.official_name} was removed from Supabase TEST successfully.`);}catch(error){closeDelete();const errorMessage=error?.message||String(error);status.textContent=`DELETE FAILED — Supabase TEST was not changed. ${errorMessage}`;showResult("Developer / Publisher Not Deleted",errorMessage,true);console.error("Developer / Publisher TEST delete failed:",error);}finally{confirmButton.disabled=false;}});
onAuthStateChanged(auth,async user=>{currentUser=user;if(!user){status.textContent="Admin authentication required.";return;}status.textContent="Loading companies from Supabase TEST…";try{const result=await callAdmin({action:"list-companies"});companies=result.companies||[];render();}catch(error){status.textContent=`LOAD FAILED — ${error?.message||error}`;console.error("Developer / Publisher TEST load failed:",error);}});
</script></body></html>

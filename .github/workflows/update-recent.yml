name: Update Recent Uploads

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch latest public YouTube uploads
        run: python scripts/update_recent.py
      - name: Commit changed recent upload data
        run: |
          if git diff --quiet -- data/recent.json; then
            echo "No Recent Uploads changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recent.json
          git commit -m "Update recent YouTube uploads"
          git push

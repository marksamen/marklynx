name: Update Video Stats

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    defaults:
      run:
        working-directory: youtube

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update video stats
        run: python scripts/update_video_stats.py

      - name: Commit changed video stats
        run: |
          if git diff --quiet -- data/stats.json; then
            echo "No video stats changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          git commit -m "Update video stats"
          git push

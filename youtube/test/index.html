<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MarkLynx Test Control</title>
<style>
  :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090b10;color:#fff;font-family:Arial,sans-serif}.box{width:min(520px,92vw);padding:34px;border:1px solid #303642;border-radius:18px;background:#11151d;text-align:center;box-shadow:0 18px 60px #0008}h1{margin:0 0 10px;font-size:28px}.status{margin:24px 0;font-size:22px;font-weight:800}.on{color:#6dff8b}.off{color:#ff6d6d}button{width:100%;padding:18px;border:0;border-radius:12px;font-size:20px;font-weight:900;cursor:pointer;margin-top:10px}.enable{background:#1f9d49;color:#fff}.disable{background:#a82d2d;color:#fff}.note{margin:20px 0 0;color:#aeb7c6;font-size:14px;line-height:1.5}
</style>
</head>
<body><main class="box">
<h1>MARKLYNX TEST CONTENT</h1>
<div id="status" class="status"></div>
<button id="toggle"></button>
<p class="note">This setting affects only this browser. Refresh/reopen the test site after changing it. Default is OFF.</p>
</main>
<script>
const KEY='marklynxTestContent';
const status=document.getElementById('status'), btn=document.getElementById('toggle');
function hidden(){return (localStorage.getItem(KEY)||'Y').toUpperCase()==='Y'}
function draw(){const h=hidden();status.textContent='TEST CONTENT: '+(h?'OFF':'ON');status.className='status '+(h?'off':'on');btn.textContent=h?'TURN TEST CONTENT ON':'TURN TEST CONTENT OFF';btn.className=h?'enable':'disable'}
btn.onclick=()=>{localStorage.setItem(KEY,hidden()?'N':'Y');draw()};draw();
</script></body></html>

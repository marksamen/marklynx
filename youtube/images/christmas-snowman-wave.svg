<svg xmlns="http://www.w3.org/2000/svg" width="168" height="214" viewBox="0 0 168 214">
  <style>
    @media screen and (prefers-reduced-motion:no-preference) {
      #wave-pivot {transform-box:view-box;transform-origin:115px 124px;animation:wave 20s ease-in-out infinite;}
      #hat-pivot {transform-box:view-box;transform-origin:83px 46px;animation:tip 20s ease-in-out infinite;}
      @keyframes wave {
        0%,15%,31%,50%,64%,100% {transform:rotate(0deg);}
        17%,23%,29% {transform:rotate(-48deg);}
        20%,26% {transform:rotate(-22deg);}
        53%,59% {transform:rotate(-55deg);}
        56% {transform:rotate(-65deg);}
      }
      @keyframes tip {
        0%,51%,63%,100% {transform:rotate(0deg);}
        55%,59% {transform:rotate(19deg);}
      }
    }
  </style>
  <defs>
    <radialGradient id="snow" cx=".32" cy=".25" r=".82"><stop stop-color="#fffdf6"/><stop offset=".56" stop-color="#f4f9fb"/><stop offset=".84" stop-color="#d0e0e9"/><stop offset="1" stop-color="#9bb4c7"/></radialGradient>
    <linearGradient id="hat" x2="1" y2=".2"><stop stop-color="#111719"/><stop offset=".38" stop-color="#495054"/><stop offset=".7" stop-color="#252b30"/><stop offset="1" stop-color="#101415"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f34c46"/><stop offset=".35" stop-color="#b71b25"/><stop offset=".7" stop-color="#95101b"/><stop offset="1" stop-color="#660d15"/></linearGradient>
    <linearGradient id="carrot" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffd77a"/><stop offset=".35" stop-color="#f99a34"/><stop offset="1" stop-color="#c34b16"/></linearGradient>
    <radialGradient id="coal" cx=".3" cy=".22"><stop stop-color="#62625d"/><stop offset=".32" stop-color="#343535"/><stop offset="1" stop-color="#101415"/></radialGradient>
    <linearGradient id="branch" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b4834c"/><stop offset="1" stop-color="#54341f"/></linearGradient>
  </defs>
  <g id="snow-base"><ellipse cx="85" cy="199" rx="67" ry="10" fill="#102f40" opacity=".2"/><path d="M10 201 Q21 191 44 194 Q58 187 80 193 Q99 185 121 193 Q145 191 159 202 Q128 212 83 211 Q39 213 10 201Z" fill="url(#snow)"/></g>
  <g id="lower-body"><ellipse cx="84" cy="165" rx="48" ry="40" fill="url(#snow)" stroke="#d3e2eb" stroke-width=".7"/><path d="M47 176 Q65 196 103 193" fill="none" stroke="#fff" stroke-width="1.5" opacity=".7"/></g>
  <g id="left-arm" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M53 127 27 112 13 91 M27 112 12 115 M19 100 5 99" stroke="#553622" stroke-width="6"/><path d="M53 125 27 110 13 90 M27 110 12 114 M19 99 5 98" stroke="url(#branch)" stroke-width="3.1"/></g>

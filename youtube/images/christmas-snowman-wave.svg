  </g>
  <g id="middle-body"><ellipse cx="84" cy="124" rx="37" ry="35" fill="url(#snow)" stroke="#d3e2eb" stroke-width=".6"/><circle cx="85" cy="132" r="5" fill="url(#coal)"/><circle cx="86" cy="150" r="5.4" fill="url(#coal)"/><circle cx="87" cy="171" r="5.8" fill="url(#coal)"/></g>
